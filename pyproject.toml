[tool.poetry]
name = "cage_isomer_builder"
version = "0.1.3"
description = "A python modules to automate the building of cages and functionalising it with isomers at different positions"
authors = ["Dinga Wonanke, Maryam Nurhuda, Matthew Addicoat"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/bafgreat/cage_isomer_builder"
repository = "https://github.com/bafgreat/cage_isomer_builder"
documentation = "https://bafgreat.github.io/cage_isomer_builder/"

[tool.poetry.urls]
Author-Github = "https://github.com/bafgreat"
Author-Website = "https://www.dingawonanke.com"

[tool.poetry.dependencies]
python = "^3.11"
ase = "^3.27.0"
stk = "^2026.1.4.0"
mofstructure = "^0.1.8.6"
scikit-learn = "^1.9.0"
tblite = {version = "^0.7.0", optional = true}
openmm = "^8.5.2"
gulp-setup = "^0.1.9"
spglib = "^2.5"
pytest = "^9.1.1"
numba = "^0.68.0"
dftd4 = {version = "^4.3.0", optional = true}
matplotlib = "^3.8"
numpy = ">=2.0"
scipy = "^1.11"
rdkit = ">=2024.3"

[tool.poetry.scripts]
cage-vertex-name = "cage_isomer_builder.cli:vertex_name_main"

[tool.poetry.extras]
# No Windows wheels for these two; the package works without them.
xtb = ["tblite"]
d4 = ["dftd4"]
all = ["tblite", "dftd4"]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.6"
mkdocstrings = {extras = ["python"], version = "^0.27"}



[tool.pytest.ini_options]
# Runs the tests and every docstring example (doctest); tests/data holds
# helper scripts that must not be imported.
testpaths = ["tests", "cage_isomer_builder"]
addopts = "-m 'not slow' --doctest-modules --ignore=tests/data"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
markers = [
    "slow: builds/optimises a full cage end-to-end (minutes, not seconds) - run explicitly with `pytest -m slow`",
]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

