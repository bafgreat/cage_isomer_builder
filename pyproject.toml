[tool.poetry]
name = "cage_isomer_builder"
version = "0.1.1"
description = "A python modules to automate the building of cages and functionalising it with isomers at different positions"
authors = ["Dinga Wonanke, Maryam Nurhuda, Matthew Addicoat"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/bafgreat/cage_isomer_builder"
repository = "https://github.com/bafgreat/cage_isomer_builder"
documentation = "https://bafgreat.github.io/cage_isomer_builder/"

[tool.poetry.urls]
Author-Github = "https://github.com/bafgreat"
Author-Website = "https://www.dingawonanke.com"

[tool.poetry.dependencies]
python = "^3.11"
ase = "^3.27.0"
stk = "^2026.1.4.0"
mofstructure = "^0.1.8.6"
scikit-learn = "^1.9.0"
tblite = "^0.7.0"
openmm = "^8.5.2"
gulp-setup = "^0.1.9"
spglib = "^2.5"
pytest = "^9.1.1"
pywindow = "^0.0.3"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.6"
mkdocstrings = {extras = ["python"], version = "^0.27"}



[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: builds/optimises a full cage end-to-end (minutes, not seconds) - run explicitly with `pytest -m slow`",
]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

