site_name: Cage Isomer Builder
site_description: >-
  Build metal-organic cages, functionalise cages and MOFs, and enumerate
  their symmetry-unique isomers.
site_url: https://bafgreat.github.io/cage_isomer_builder/
repo_name: bafgreat/cage_isomer_builder
repo_url: https://github.com/bafgreat/cage_isomer_builder
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Installation: installation.md
  - Guide:
      - Quick start: guide/quickstart.md
      - Build & enumerate isomers: guide/build-and-enumerate.md
      - Optimisation: guide/optimisation.md
      - Functionalise isomers: guide/functionalising-isomers.md
      - Functionalise MOFs: guide/functionalise-mofs.md
      - R sites & file formats: guide/r-sites.md
      - Statistics: guide/statistics.md
      - Descriptors: guide/descriptors.md
      - Multivariate pores & defects: guide/multivariate.md
      - Guests & matching: guide/matching.md
      - Host-guest docking: guide/host-guest-docking.md
  - Topologies: topologies.md
  - API Reference:
      - Cage builders: reference/cage.md
      - Example structures: reference/example-data.md
      - R sites: reference/sites.md
      - R-group isomers: reference/rgroup.md
      - Isomer counting: reference/isomer-counting.md
      - Vertex codes: reference/vertex-codes.md
      - Command line: reference/cli.md
      - Point groups: reference/pointgroup.md
      - Symmetry libraries: reference/symmetry.md
      - Features: reference/features.md
      - Pair distributions: reference/distributions.md
      - Isomer ensembles: reference/ensemble.md
      - Flexibility: reference/flexibility.md
      - Guest matching: reference/matching.md
      - Functionalise & docking: reference/functionalise.md
      - Cavity & windows: reference/cavity.md
      - Dispersion: reference/dispersion.md
      - Optimisation: reference/optimise.md
      - UFF4MOF parameters: reference/uff4mof.md
      - xTB (tblite): reference/tblite.md
      - Rigid bodies: reference/rigid-body.md
      - Read / write: reference/read-write.md
      - Geometry utilities: reference/geometry.md
  - License: license.md

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://www.dingawonanke.com
      name: Dinga Wonanke
    - icon: fontawesome/brands/github
      link: https://github.com/bafgreat
      name: bafgreat on GitHub
