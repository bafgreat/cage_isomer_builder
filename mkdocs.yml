site_name: Cage Isomer Builder
site_description: >-
  A comprehensive Python library for building, enumerating, and
  functionalising metal-organic cage and framework (MOF) isomers.
site_url: https://bafgreat.github.io/cage_isomer_builder/
repo_name: bafgreat/cage_isomer_builder
repo_url: https://github.com/bafgreat/cage_isomer_builder
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Installation: installation.md
  - Guide:
      - Build & enumerate isomers: guide/build-and-enumerate.md
      - Functionalise isomers: guide/functionalising-isomers.md
      - Host-guest docking: guide/host-guest-docking.md
      - Statistics: guide/statistics.md
      - Functionalise MOFs: guide/functionalise-mofs.md
  - Topologies: topologies.md
  - API Reference:
      - Cage builders: reference/cage.md
      - Functionalise & docking: reference/functionalise.md
      - Read / write: reference/read-write.md
      - Geometry utilities: reference/geometry.md
      - Optimisation: reference/optimise.md
  - License: license.md
